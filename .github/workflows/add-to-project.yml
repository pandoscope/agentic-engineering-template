name: Add to project board

on:
  issues:
    types: [opened, reopened]
  # `pull_request` from a fork carries no secrets, so the bot's key would
  # be empty exactly when a contributor opens a PR. The base-context event
  # has it. Safe here only because this workflow never checks out — let
  # alone runs — the PR's code.
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: add-to-project-${{ github.event.number || github.event.issue.number }}

jobs:
  add:
    name: "add to board"
    runs-on: ubuntu-latest
    # GitHub's built-in auto-add workflow is plan-limited to a single
    # repository, so the board is populated from here instead. Repos that
    # set no board URL, or whose org has no release bot yet, show this job
    # as SKIPPED rather than green or red (#301).
    if: ${{ vars.PROJECT_BOARD_URL != '' && vars.RELEASE_BOT_CLIENT_ID != '' }}
    steps:
      # An ORG-level project is outside the repo-scoped GITHUB_TOKEN's
      # reach. The release bot mints a fresh installation token per run,
      # narrowed to the board, so there is no personal access token to
      # renew (#305). The app needs organization Projects: write; without
      # it this step fails, and that red job is the signal. Do not soften
      # it into a warning.
      - name: Mint release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        with:
          project-url: ${{ vars.PROJECT_BOARD_URL }}
          github-token: ${{ steps.app-token.outputs.token }}
