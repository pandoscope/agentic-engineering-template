# questions
agentic_subtemplate:
  type: str
  help: >-
    Which subtemplate to render: `template` is the full project scaffold;
    `decision-memory` stamps a decision-memory STORE — the recorder, the
    CI guards (validator + guard runner + workflow), the preference-set
    lifecycle (budget, carve-out gate, replay, compaction skill), the
    vendored store docs, and a seeded preference set;
    `evidence-memory` stamps an evidence STORE — the capture writer, the
    CI guards (validator + guard runner + workflow), and the vendored
    store docs;
    `session-memory` stamps a session STORE — the store's agent rules
    and the workflow that reports its ticket closes to the ledger; its
    recorder ships with the thread-ledger skill, not from here. With
    any store subtemplate, all project-scaffold questions are skipped,
    keeping the store's answers file minimal.
  choices:
    - template
    - decision-memory
    - evidence-memory
    - session-memory
  default: template

agentic_project_name:
  type: str
  help: "Human-readable project name (agent docs, glossary)."
  placeholder: "My Project"
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_project_description:
  type: str
  help: "Short project description (glossary seed entry)."
  placeholder: "A helpful project."
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_project_slug:
  type: str
  help: "Project slug in kebab-case (repo URL, glossary path). Auto-derived from name; override if needed."
  default: "{{ agentic_project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_project_kind:
  type: str
  help: "Repository kind. `code` renders code-specific artifacts (coding rules, code skills, architecture stub); `docs` omits them. Flip the answer and run `copier update` when code lands."
  choices:
    - code
    - docs
  default: code
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_language:
  type: str
  help: "Primary content language as an ISO 639-1 code (e.g. en, de). Language-sensitive tooling (codespell) is only rendered for English content."
  default: en
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_disambiguate_version:
  type: str
  help: "Pinned disambiguate version (pre-alpha — breaking changes between releases; hook, docs commands and the post-stamp prune use this pin)."
  default: "0.3.0"
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_disambiguate_roots:
  type: str
  help: >-
    Extra arguments appended to the `disambiguate --lint` hook entry
    (e.g. "docs/glossary/ --roots docs/conventions.md 'docs/notes/*.md'").
    Empty keeps disambiguate's default roots. Kept as answer data so repos
    never patch the template-owned .pre-commit-config.yaml.
  default: ""
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_precommit:
  type: str
  help: "Install cross-cutting prek hooks (commitlint, JSON, Markdown, codespell)?"
  choices:
    - prek
    - none
  default: prek
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_actions_runner:
  type: str
  help: >-
    runs-on label for every rendered GitHub Actions workflow. The default
    stays ubuntu-latest because a third-party label (e.g.
    blacksmith-2vcpu-ubuntu-2204) makes jobs queue forever on a repo
    without that runner provider's app installed.
  default: "ubuntu-latest"

agentic_merge_approval_gate:
  type: bool
  help: >-
    Require a current human Approve review before merge, as a ci-ok gate
    job (agentic-engineering-template#187). A PR authored by an
    allowlisted approver passes without a review — the author cannot
    approve their own PR, and authorship is approval by the same party.
  default: true
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_merge_approvers:
  type: str
  help: >-
    Comma-separated GitHub logins whose Approve review satisfies the
    merge-approval gate (humans, never bots). Rendered into
    .github/merge-approvers.json. The repo owner may be an org, so this
    cannot be defaulted from it.
  default: ""
  validator: "{% if agentic_subtemplate == 'template' and agentic_merge_approval_gate and not agentic_merge_approvers %}Required while agentic_merge_approval_gate is true — name at least one human login{% endif %}"
  when: "{{ agentic_subtemplate == 'template' and agentic_merge_approval_gate }}"

agentic_tracker_cli:
  type: str
  help: "Tracker CLI agents must use for repository interaction (issues/PRs/CI)."
  choices:
    - ghx
    - gh
    - tea
  default: ghx
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_forge:
  type: str
  help: "Forge hosting the repository."
  choices:
    - github
    - forgejo
  default: |-
    {%- set remote_forge = detect_forge() -%}
    {%- if remote_forge -%}
    {{ remote_forge }}
    {%- else -%}
    github
    {%- endif %}
  # Gated on the subtemplate only. Gating on `detect_forge()` made the
  # ANSWER conditional on the machine: recorded when detection failed,
  # dropped when it succeeded. The probe seeds the default above, where
  # the recorded answer supersedes it on every later update.
  when: "{{ agentic_subtemplate == 'template' }}"

agentic_forgejo_host:
  type: str
  help: "Forgejo hostname (e.g. git.example.com)."
  when: "{{ agentic_forge == 'forgejo' }}"
  validator: "{% if agentic_forge == 'forgejo' and not agentic_forgejo_host %}Required{% endif %}"

agentic_repo_host:
  type: str
  default: |-
    {%- if agentic_forge == 'github' -%}
    github.com
    {%- else -%}
    {{ agentic_forgejo_host }}
    {%- endif %}
  when: false

agentic_repo_owner:
  type: str
  help: "Repository owner (user or org)."
  default: |-
    {%- set owner = resolve_repo_owner() -%}
    {%- if owner -%}
    {{ owner }}
    {%- else -%}
    {{ UNSET }}
    {%- endif %}
  validator: "{% if agentic_subtemplate == 'template' and not agentic_repo_owner %}Could not detect repo owner — run `gh auth login` or `git config github.user <login>`, or enter manually{% endif %}"
  when: "{{ agentic_subtemplate == 'template' }}"

# Copier metadata
_min_copier_version: "9.11.0"
_subdirectory: "{{ agentic_subtemplate }}"
# Keep the .claude/skills → ../.agents/skills bridge a symlink in generated
# repos instead of copying (a copy would be empty — skills install post-render).
_preserve_symlinks: true
_answers_file: .copier-answers.agentic.yml
# Seeded once, never overwritten on `copier update` — rich repo-local rules
# live there so AGENTS.md updates never conflict with hand-written content.
_skip_if_exists:
  - "{% if agentic_subtemplate == 'template' %}docs/conventions.md{% endif %}"
  # The repo's own SessionStart bootstrap (#220): the stamped
  # .claude/settings.json is template-owned and runs this script last, so a
  # repo's session tooling lives here instead of drifting the settings file.
  - "{% if agentic_subtemplate == 'template' %}scripts/session-start.local.sh{% endif %}"
  # The store's preference set (source + render) and its config knobs are
  # seeded once and owned by the store; everything else in the decision-memory
  # subtemplate is vendored (overwritten on copier update). Clobbering any of
  # them would reset rules and budgets a human tuned.
  - "{% if agentic_subtemplate == 'decision-memory' %}preferences.json{% endif %}"
  - "{% if agentic_subtemplate == 'decision-memory' %}preferences.txt{% endif %}"
  - "{% if agentic_subtemplate == 'decision-memory' %}store.config.json{% endif %}"
  # The shortcode map is the store's data — the template seeds an empty
  # scaffold and never overwrites the org's own entries.
  - "{% if agentic_subtemplate == 'session-memory' %}repo-codes.json{% endif %}"
_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions/agentic.py:AgenticExtension

# Tasks are scaffold-only: the decision-memory subtemplate stamps data-repo files
# and must not install skills, run doctor, or register hooks there.
_tasks:
  - "{% if agentic_subtemplate == 'template' %}npx skills@latest experimental_install{% else %}true{% endif %}"
  # Advisory, never a gate: copier rolls the whole render back on a non-zero
  # task, so a missing host tool would lose the stamp over a report. Doctor's
  # own exit code is untouched — a direct run still fails hard.
  - >-
    {% if agentic_subtemplate == 'template' %}bash scripts/doctor.sh
    || true{% else %}true{% endif %}
  # Register prek git hooks so commits actually run them. A config file alone
  # does nothing — `prek install` must write .git/hooks. Guard on a git work
  # tree (copier may render into a plain dir) and on prek being selected.
  - >-
    {% if agentic_subtemplate == 'template' and agentic_precommit == 'prek' %}git rev-parse --is-inside-work-tree
    >/dev/null 2>&1 && prek install || true{% else %}true{% endif %}
  # Converge the glossary: a repo receives every shared term and keeps only the
  # ones it links, so the orphan check needs no exemption and no repo curates
  # the set by hand. Advisory for the same reason as the report above — an
  # unconverged glossary is a lint finding, not a reason to lose the stamp.
  - >-
    {% if agentic_subtemplate == 'template' %}bash scripts/ci/prune_glossary.sh
    || true{% else %}true{% endif %}
