name: Render ledger

# On-demand only. Rendering on every ledger push billed a minimum
# minute per append while the principal read the local heartbeat
# render (LEDGER_RENDER_PATH) instead; LEDGER.md may therefore lag
# the log until the next dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-ledger
  cancel-in-progress: true

jobs:
  render:
    name: "LEDGER.md"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch the renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tool lives with the skill, not with the data — one
          # source, and this store never carries a second copy to
          # drift from it. `<owner>/skills` is the convention for
          # where the thread-ledger skill lives.
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/skills.git" \
            /tmp/skills
          git -C /tmp/skills sparse-checkout set original/thread-ledger

      - name: Render
        run: |
          set -euo pipefail
          # The identity comes from the store's own recorded URL, so this
          # names no session; the title carries the owner, not a baked-in
          # org name.
          node /tmp/skills/original/thread-ledger/ledger.mjs \
            --root . \
            render --format md --out LEDGER.md \
            --title "${{ github.repository_owner }} — thread ledger"

      - name: Commit when it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The commit is created through the API, not the git CLI:
          # createCommitOnBranch commits are signed by GitHub and show
          # as Verified, so the store can require verified signatures
          # without exempting this bot. expectedHeadOid makes the write
          # compare-and-swap: if main moved (a session pushed, the
          # close-loop committed), the mutation fails cleanly and the
          # run re-syncs and re-renders — nobody's history is rebased.
          for attempt in 1 2 3; do
            if git diff --quiet -- LEDGER.md; then
              echo "LEDGER.md already current — nothing to commit."
              exit 0
            fi
            head="$(git rev-parse HEAD)"
            jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg head "$head" \
              --arg c "$(base64 -w0 LEDGER.md)" \
              '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: {input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                  expectedHeadOid: $head,
                  message: {headline: "chore: render LEDGER.md"},
                  fileChanges: {additions: [{path: "LEDGER.md", contents: $c}]}}}}' \
              > /tmp/graphql.json
            if gh api graphql --input /tmp/graphql.json --silent; then
              exit 0
            fi
            echo "main moved under the render (attempt $attempt) — re-syncing."
            git fetch origin main
            git reset --hard origin/main
            node /tmp/skills/original/thread-ledger/ledger.mjs \
              --root . \
              render --format md --out LEDGER.md \
              --title "${{ github.repository_owner }} — thread ledger"
          done
          echo "::error::could not commit LEDGER.md after 3 attempts"
          exit 1
